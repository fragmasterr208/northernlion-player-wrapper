<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="referrer" content="strict-origin-when-cross-origin">
  <title>Northernlion YouTube test</title>
  <style>
    html,body { margin:0; width:100%; height:100%; background:#000; overflow:hidden; }
    #player { width:100%; height:100%; }
    #message { position:fixed; left:8px; top:8px; z-index:2; color:#fff; background:#222d; padding:6px 8px; border-radius:4px; font:12px system-ui; }
  </style>
</head>
<body>
  <div id="message">Starting YouTube player…</div>
  <div id="player"></div>
  <script>
    const params = new URLSearchParams(location.search);
    const videoId = params.get("video") || "o4H8k_JPuUs";
    const autoplay = params.get("autoplay") === "1" ? 1 : 0;
    const mute = params.get("mute") !== "0";
    const message = document.getElementById("message");
    const tag = document.createElement("script");
    tag.src = "https://www.youtube.com/iframe_api";
    document.head.appendChild(tag);

    let player;
    window.onYouTubeIframeAPIReady = function () {
      player = new YT.Player("player", {
        width: "100%",
        height: "100%",
        videoId,
        playerVars: {
          autoplay,
          playsinline: 1,
          controls: 1,
          rel: 0,
          origin: location.origin
        },
        events: {
          onReady(event) {
            if (mute) event.target.mute();
            if (autoplay) event.target.playVideo();
            message.textContent = "Player ready — muted autoplay requested";
            setTimeout(() => message.remove(), 4500);
          },
          onStateChange(event) {
            if (event.data === YT.PlayerState.PLAYING) {
              message.textContent = "Playing";
              setTimeout(() => message.remove(), 1200);
            }
          },
          onError(event) {
            message.textContent = "YouTube player error: " + event.data;
          }
        }
      });
    };
  </script>
</body>
</html>
